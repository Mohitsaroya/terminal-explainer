version: 1

rules:
  - id: rm-recursive-everything
    level: danger
    match:
      program: rm
      flags_all: ["-r"]
      targets_any: ["/", "~", "~/", "*", ".", "/*"]
    reason: "Permanently deletes {targets} and everything inside it. There is no trash and no undo."
    tip: "Run `ls {targets}` first to see what would be deleted."
    examples:
      match:    ["rm -rf /", "rm -r ~", "rm -fr *", "rm --recursive ."]
      no_match: ["rm notes.txt", "rm -r build/"]

  - id: rm-recursive
    level: caution
    match:
      program: rm
      flags_all: ["-r"]
    reason: "Deletes the folder {targets} and all {count} files inside it."
    examples:
      match: ["rm -r build/"]

  - id: pipe-to-shell
    level: danger
    match:
      program: [curl, wget]
      pipes_to: [sh, bash, zsh]
    reason: "Downloads a script from the internet and runs it immediately, without you seeing what it does."
    examples:
      match: ["curl https://x.sh | bash", "wget -qO- x.sh | sudo sh"]

  - id: fork-bomb
    level: danger
    match:
      raw_regex: ':\(\)\s*\{.*:\|:.*\}'
    reason: "Starts copies of itself until your computer freezes."

  - id: touch-brace-expansion
    level: caution
    match:
      program: touch
      raw_regex: '\{[^}]*,[^}]*\}'
    reason: "Will create multiple files that might not be used"

safe:
  - id: touch
    match:
      program: touch
      flags_allowed: []
      targets_must: [no_glob]
    note: "Creates {targets} if it doesn't exist, or updates its timestamp."
    examples:
      match:  ["touch notes.txt", "touch a.py b.py"]
      no_match: ["sudo touch /etc/x"]
      
  - id: rm-one-file
    match:
      program: rm
      flags_allowed: ["-i", "-v"]       # any other flag → not safe
      max_targets: 1
      targets_must: [no_glob, not_hidden, in_cwd]
    note: "Deletes {targets}. It won't go to the trash."
    examples:
      match:    ["rm notes.txt", "rm -i draft.md"]
      no_match: ["rm *.txt", "rm a.txt b.txt", "rm .bashrc",
                 "rm ../x.txt", "rm -r folder", "sudo rm x.txt"]
                 
  - id: mkdir
    match:
      program: mkdir
      flags_allowed: ["-p", "-v"]
    examples:
      match: ["mkdir project", "mkdir -p src/utils"]


modifiers:
  sudo:
    bump: 1        # caution → danger
    note: "This runs as administrator, so it can change system files."

  