[project]
name = "explain-term"
version = "0.1.0"
description = "A terminal that explains commands before they run, stops dangerous ones, and explains errors."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
pretty = ["rich>=13"]
dev = ["pytest>=7"]

[project.scripts]
explain = "explain.cli:main"

[tool.setuptools]
packages = ["explain"]

[tool.setuptools.package-data]
explain = ["rules.yaml"]
