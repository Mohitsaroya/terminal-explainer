# rules for detecting programs/args
# a rule with an `args` list only matches when one of those arguments is used
# the first matching rule wins, so keep the specific rules above the general ones
# levels: safe, caution, danger


rules:
  - program: rm
    args: ["/", "/*", "~", "~/", "~/*", "*", ".", "..", "$HOME", "$HOME/*", "${HOME}", "${HOME}/*"]
    level: danger
    reason: Deletes everything under a top-level or current folder, with no undo.
  - program: rm
    level: caution
    reason: Deletes files permanently (there is no trash bin).
  #not a program but special case
  - program: sudo
    level: caution
    reason: Runs as administrator, so mistakes can affect the whole system.
  - program: touch
    level: safe
    reason: Creates a file (harmless).